<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS Memory Match</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a24; --card-bg:#1c1f2b; --text:#eef1fa; --muted:#9aa1b8;
  --accent:#7c9bff; --win:#3ddc97; --lose:#ff6b6b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5fb; --panel:#ffffff; --card-bg:#eef0fa; --text:#1a1c26; --muted:#6b7189;
    --accent:#4b63d1; --win:#1f9d6f; --lose:#d64545;
  }
}
:root[data-theme="light"]{
  --bg:#f4f5fb; --panel:#ffffff; --card-bg:#eef0fa; --text:#1a1c26; --muted:#6b7189;
  --accent:#4b63d1; --win:#1f9d6f; --lose:#d64545;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center; padding:24px 16px 48px;
}
h1{font-size:1.4rem; margin:4px 0 2px;}
p.sub{color:var(--muted); margin:0 0 18px; font-size:.85rem; text-align:center; max-width:420px;}

.panel{
  background:var(--panel); border-radius:14px; padding:18px 20px; width:100%;
  max-width:420px; margin-bottom:18px; border:1px solid rgba(124,155,255,.15);
}
.panel h2{font-size:.95rem; margin:0 0 12px;}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px;}
.field label{font-size:.75rem; color:var(--muted);}
.field input{
  background:var(--card-bg); border:1px solid rgba(124,155,255,.2); color:var(--text);
  padding:8px 10px; border-radius:8px; font-size:.9rem;
}
.row{display:flex; gap:10px;}
.row .field{flex:1;}

button{
  background:var(--accent); color:#fff; border:none; padding:10px 18px;
  border-radius:8px; font-size:.85rem; cursor:pointer; font-weight:600;
}
button.secondary{background:transparent; border:1px solid var(--muted); color:var(--text);}
button:disabled{opacity:.45; cursor:not-allowed;}
.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;}

.stats{
  display:flex; gap:16px; margin-bottom:14px; font-size:.85rem; color:var(--muted);
  flex-wrap:wrap; justify-content:center;
}
.stats b{color:var(--text);}
.stats .timer.low{color:var(--lose);}

.board{
  display:none; grid-template-columns:repeat(4,minmax(58px,84px));
  grid-auto-rows:minmax(58px,84px); gap:10px; max-width:100%;
  padding:4px; margin-bottom:10px;
}
.board.visible{display:grid;}
.card{position:relative; width:100%; height:100%; cursor:pointer; perspective:800px;}
.card.locked{cursor:default;}
.card-inner{position:relative; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d;}
.card.flipped .card-inner, .card.matched .card-inner{transform:rotateY(180deg);}
.face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:10px;
  display:flex; align-items:center; justify-content:center; text-align:center;
  padding:6px; font-size:.78rem; font-weight:600; line-height:1.15;
}
.face.back{background:var(--card-bg); border:2px solid rgba(124,155,255,.25); color:var(--accent); font-size:1.3rem;}
.face.front{transform:rotateY(180deg); border:2px solid transparent; color:#10121a;}
.card.matched .face.front{opacity:.5;}
.card.mismatch .card-inner{animation:shake .4s;}
@keyframes shake{
  20%{transform:translateX(-4px) rotateY(180deg);}
  40%{transform:translateX(4px) rotateY(180deg);}
  60%{transform:translateX(-3px) rotateY(180deg);}
  80%{transform:translateX(3px) rotateY(180deg);}
}

.result-msg{margin:6px 0 4px; font-weight:700; font-size:1rem; text-align:center; min-height:1.4em;}
.result-msg.win{color:var(--win);}
.result-msg.lose{color:var(--lose);}

.leaderboard{width:100%; max-width:420px; margin-top:6px;}
.leaderboard h2{font-size:.95rem; margin:0 0 10px;}
table{width:100%; border-collapse:collapse; font-size:.82rem;}
th,td{text-align:left; padding:6px 8px; border-bottom:1px solid rgba(124,155,255,.12);}
th{color:var(--muted); font-weight:600; font-size:.72rem; text-transform:uppercase;}
td.status-won{color:var(--win); font-weight:600;}
td.status-lost{color:var(--lose); font-weight:600;}
.empty-row td{color:var(--muted); text-align:center; padding:14px 0;}

/* Match popup */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
  align-items:center; justify-content:center; z-index:50; padding:20px;
}
.overlay.visible{display:flex;}
.modal{
  background:var(--panel); border-radius:14px; padding:22px 24px; max-width:340px;
  width:100%; text-align:center; border-top:5px solid var(--accent);
}
.modal .pair{display:flex; justify-content:center; gap:10px; margin-bottom:14px;}
.modal .pair span{
  background:var(--card-bg); border-radius:8px; padding:8px 14px; font-weight:700;
}
.modal p{margin:0 0 16px; color:var(--muted); font-size:.9rem;}
.modal button{width:100%;}
</style>
</head>
<body>
<h1>🧠 CS Memory Match</h1>
<p class="sub">Match the card pairs before time runs out.</p>

<div class="panel" id="setupPanel">
  <h2>Game setup</h2>
  <div class="field">
    <label for="nameInput">Your name</label>
    <input id="nameInput" type="text" placeholder="e.g. Yasser" maxlength="20">
  </div>
  <div class="actions">
    <button id="startBtn">Start game</button>
  </div>
</div>

<div class="stats" id="stats" style="display:none;">
  <span>⏱ <b id="timer" class="timer">--</b>s</span>
  <span>Moves: <b id="moves">0</b></span>
  <span>Matches: <b id="matches">0</b>/<span id="totalPairs">9</span></span>
  <span>Score: <b id="liveScore">1000</b></span>
</div>

<div class="board" id="board"></div>
<div class="result-msg" id="resultMsg"></div>
<div class="actions" id="gameActions" style="display:none;">
  <button class="secondary" id="restartBtn">New game</button>
  <button class="secondary" id="themeBtn">Toggle theme</button>
</div>

<div class="leaderboard">
  <h2>🏆 Scoreboard <span style="color:var(--muted); font-weight:400; font-size:.72rem;">(saved on this device)</span></h2>
  <table>
    <thead><tr><th>Name</th><th>Result</th><th>Moves</th><th>Time</th><th>Score</th></tr></thead>
    <tbody id="scoreBody"></tbody>
  </table>
</div>

<div class="overlay" id="matchOverlay">
  <div class="modal">
    <div class="pair" id="matchPair"></div>
    <p id="matchTopic"></p>
    <button id="matchClose">Nice, continue</button>
  </div>
</div>

<script>
const PAIRS = [
  { color:"#f5c542", a:"65",          b:"'A'",               topic:"65 is the ASCII code for the uppercase letter A." },
  { color:"#f2994a", a:"O(n log n)",   b:"Merge Sort",        topic:"Merge Sort runs in O(n log n) time in the average and worst case." },
  { color:"#eb5757", a:"Stack",        b:"LIFO",              topic:"A stack follows Last-In, First-Out ordering." },
  { color:"#f78fb3", a:"Queue",        b:"FIFO",              topic:"A queue follows First-In, First-Out ordering." },
  { color:"#9b59b6", a:"1010₂",        b:"10",                topic:"Binary 1010 equals decimal 10." },
  { color:"#5b8def", a:"Binary Search", b:"O(log n)",        topic:"Binary Search halves the search space each step, giving O(log n) time on a sorted array." },
  { color:"#2ec4b6", a:"Hash Table",   b:"O(1) avg lookup",   topic:"A hash table gives O(1) average-case lookup time." },
  { color:"#3ddc97", a:"Recursion",    b:"Calls itself",      topic:"Recursion is when a function calls itself to solve a smaller subproblem." },
  { color:"#6c5ce7", a:"Concurrency",  b:"Parallelism",       topic:"Concurrency is multiple tasks making progress (possibly interleaved on one core); parallelism is tasks actually running at the same instant on multiple cores." },
];

const STORAGE_KEY = "csMemoryScores";
const PREVIEW_SECONDS = 3;
const GAME_SECONDS = 45;
let deck = [], flipped = [], matches = 0, moves = 0, lock = true;
let countdown = null, timeLeft = 0, previewSecs = PREVIEW_SECONDS, gameSecs = GAME_SECONDS, playerName = "Player";

function $(id){ return document.getElementById(id); }

function loadScores(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveScore(entry){
  try{
    const scores = loadScores();
    scores.push(entry);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
  }catch(e){ /* storage unavailable, ignore */ }
  renderScores();
}
function renderScores(){
  const scores = loadScores().sort((a,b) => {
    if (a.result !== b.result) return a.result === "won" ? -1 : 1;
    return b.score - a.score;
  }).slice(0, 10);
  const body = $("scoreBody");
  if (!scores.length){
    body.innerHTML = `<tr class="empty-row"><td colspan="5">No games played yet — be the first!</td></tr>`;
    return;
  }
  body.innerHTML = scores.map(s => `
    <tr>
      <td>${escapeHtml(s.name)}</td>
      <td class="status-${s.result}">${s.result === "won" ? "Won" : "Lost"}</td>
      <td>${s.moves}</td>
      <td>${s.timeUsed}s</td>
      <td><b>${s.score}</b></td>
    </tr>`).join("");
}
function computeScore(previewSeconds, timeUsedSeconds, movesCount){
  const raw = 1000
    - (20 * previewSeconds)
    - (5 * timeUsedSeconds)
    - (10 * Math.max(0, movesCount - PAIRS.length));
  return Math.max(0, Math.round(raw));
}
function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function buildDeck(){
  const cards = [];
  PAIRS.forEach((p, i) => {
    cards.push({ pairId:i, text:p.a, color:p.color });
    cards.push({ pairId:i, text:p.b, color:p.color });
  });
  for (let i = cards.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  return cards;
}

function renderBoard(){
  const board = $("board");
  board.innerHTML = "";
  board.classList.add("visible");
  deck.forEach((c, idx) => {
    const el = document.createElement("div");
    el.className = "card locked";
    el.dataset.idx = idx;
    el.innerHTML = `
      <div class="card-inner">
        <div class="face back">?</div>
        <div class="face front" style="background:${c.color}">${c.text}</div>
      </div>`;
    el.addEventListener("click", () => onFlip(idx, el));
    board.appendChild(el);
  });
}

function setAllFaceUp(show){
  document.querySelectorAll(".card").forEach(el => {
    el.classList.toggle("flipped", show);
  });
}

function startGame(){
  playerName = ($("nameInput").value || "Player").trim().slice(0, 20) || "Player";
  previewSecs = PREVIEW_SECONDS;
  gameSecs = GAME_SECONDS;

  deck = buildDeck();
  flipped = []; matches = 0; moves = 0; lock = true;
  $("resultMsg").textContent = "";
  $("resultMsg").className = "result-msg";
  $("setupPanel").style.display = "none";
  $("stats").style.display = "flex";
  $("gameActions").style.display = "flex";
  $("moves").textContent = 0;
  $("matches").textContent = 0;
  $("liveScore").textContent = 1000;

  renderBoard();
  setAllFaceUp(true);
  document.querySelectorAll(".card").forEach(el => el.classList.add("locked"));
  $("timer").textContent = "preview";

  let p = previewSecs;
  const previewTick = setInterval(() => {
    $("timer").textContent = `preview ${p}`;
    p--;
    if (p < 0){
      clearInterval(previewTick);
      setAllFaceUp(false);
      document.querySelectorAll(".card").forEach(el => el.classList.remove("locked"));
      lock = false;
      beginCountdown();
    }
  }, 1000);
}

function beginCountdown(){
  timeLeft = gameSecs;
  $("timer").textContent = timeLeft;
  $("timer").classList.remove("low");
  countdown = setInterval(() => {
    timeLeft--;
    $("timer").textContent = timeLeft;
    if (timeLeft <= 10) $("timer").classList.add("low");
    updateLiveScore();
    if (timeLeft <= 0){
      clearInterval(countdown);
      endGame(false);
    }
  }, 1000);
}

function updateLiveScore(){
  const elapsed = gameSecs - Math.max(timeLeft, 0);
  $("liveScore").textContent = computeScore(previewSecs, elapsed, moves);
}

function onFlip(idx, el){
  if (lock) return;
  if (el.classList.contains("flipped") || el.classList.contains("matched")) return;
  if (flipped.length === 2) return;

  el.classList.add("flipped");
  flipped.push({ idx, el });

  if (flipped.length === 2){
    moves++;
    $("moves").textContent = moves;
    updateLiveScore();
    lock = true;
    const [f1, f2] = flipped;
    const same = deck[f1.idx].pairId === deck[f2.idx].pairId;
    setTimeout(() => {
      if (same){
        f1.el.classList.add("matched");
        f2.el.classList.add("matched");
        matches++;
        $("matches").textContent = matches;
        flipped = [];
        showMatchPopup(deck[f1.idx].pairId, () => {
          lock = false;
          if (matches === PAIRS.length) endGame(true);
        });
      } else {
        f1.el.classList.add("mismatch");
        f2.el.classList.add("mismatch");
        setTimeout(() => {
          f1.el.classList.remove("flipped", "mismatch");
          f2.el.classList.remove("flipped", "mismatch");
          flipped = [];
          lock = false;
        }, 420);
      }
    }, 500);
  }
}

function showMatchPopup(pairId, onClose){
  const p = PAIRS[pairId];
  $("matchPair").innerHTML = `
    <span style="background:${p.color}22; border:1px solid ${p.color};">${p.a}</span>
    <span style="background:${p.color}22; border:1px solid ${p.color};">${p.b}</span>`;
  $("matchTopic").textContent = p.topic;
  $("matchOverlay").classList.add("visible");
  const closeHandler = () => {
    $("matchOverlay").classList.remove("visible");
    $("matchClose").removeEventListener("click", closeHandler);
    if (onClose) onClose();
  };
  $("matchClose").addEventListener("click", closeHandler);
}

function endGame(won){
  lock = true;
  if (countdown) clearInterval(countdown);
  const timeUsed = won ? (gameSecs - Math.max(timeLeft, 0)) : gameSecs;
  const score = computeScore(previewSecs, timeUsed, moves);
  $("liveScore").textContent = score;
  document.querySelectorAll(".card:not(.matched)").forEach(el => el.classList.remove("flipped"));

  const msg = $("resultMsg");
  if (won){
    msg.textContent = `🎉 ${playerName} solved it in ${moves} moves, ${timeUsed}s — score ${score}!`;
    msg.className = "result-msg win";
  } else {
    msg.textContent = `⏰ Time's up — ${playerName} matched ${matches}/${PAIRS.length} — score ${score}.`;
    msg.className = "result-msg lose";
  }
  saveScore({ name: playerName, result: won ? "won" : "lost", moves, timeUsed, score });
}

function resetToSetup(){
  if (countdown) clearInterval(countdown);
  $("setupPanel").style.display = "block";
  $("stats").style.display = "none";
  $("gameActions").style.display = "none";
  $("board").classList.remove("visible");
  $("board").innerHTML = "";
  $("resultMsg").textContent = "";
}

$("startBtn").addEventListener("click", startGame);
$("restartBtn").addEventListener("click", resetToSetup);
$("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
});

renderScores();
$("totalPairs").textContent = PAIRS.length;
</script>
</body>
</html>
